services:
  gpu-service:
    image: elainasuki/rc2026:mujoco
    container_name: roboticArm
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OMP_WAIT_POLICY=passive
      - TERM=xterm-256color
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - ./..:/home/Elaina/mujoco_roboticarm
    runtime: "nvidia"
    tty: true
    network_mode: "host"
    user: 'Elaina'
    privileged: true
    stdin_open: true
    entrypoint: ["/bin/bash", "-c", "exec sleep infinity"]
    working_dir: "/home/Elaina/mujoco_roboticarm" # 指定默认工作目录
